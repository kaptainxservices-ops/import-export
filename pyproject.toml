[project]
name = "import-export"
version = "0.1.0"
description = "Email extraction and matching backend for iPhone trading"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids calling a function in an argument default. In FastAPI, Depends(),
# Query() and Header() in defaults are the framework's own idiom — the rule is right
# in general and wrong here.
"app/api/*.py" = ["B008"]
